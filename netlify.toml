[build]
  command = "npm run build"
  publish = "_site"
[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/ka/*"
  to = "/ka/404.html"
  status = 404
[[redirects]]
  from = "/en/*"
  to = "/en/404.html"
  status = 404
[[redirects]]
  from = "/*"
  to = "/ka/404.html"
  status = 404
